<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Фильмотека{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="{% url 'film_catalog' %}">Фильмотека</a>
                </div>
                <div class="nav-links">
                    <a href="{% url 'film_catalog' %}">Каталог</a>    {% if user.is_authenticated %}
                    <a href="{% url 'user_profile' user_id=user.id %}">Профиль</a>    {% else %}
                    <a href="{% url 'login' %}">Профиль</a>    {% endif %}
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Фильмотека. Все права защищены.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
